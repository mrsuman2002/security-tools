<!doctype html><meta charset="utf-8"><title>Local port-check lab</title><script>const targets=[{host:"127.0.0.1",port:80},{host:"127.0.0.1",port:53}];for(const target of targets){const controller=new AbortController();const timeoutId=setTimeout(()=>controller.abort(),2000);fetch(`http://${target.host}:${target.port}`,{signal:controller.signal,mode:"no-cors"}).then(()=>console.log(`${target.host}:${target.port}: reachable`)).catch(()=>console.log(`${target.host}:${target.port}: unavailable`)).finally(()=>clearTimeout(timeoutId));}</script>
